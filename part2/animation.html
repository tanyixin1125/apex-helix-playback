    const NAMES = {1:"Lift",2:"Drop",3:"Helix",4:"Climb",5:"Brake"};
    const COL = {1:"#2b6ea3",2:"#c44b4b",3:"#2c8a5a",4:"#6d4ea3",5:"#d4892a"};
    const T_END = TRACK[TRACK.length - 1].t;
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let yaw = -0.7, pitch = 0.45, dist = 150, playing = false, t = 0, last = 0;
    const origin = TRACK.reduce((a, p) => [a[0]+p.x, a[1]+p.y, a[2]+p.z], [0,0,0]).map(v => v / TRACK.length);

    function resize() {
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;
    }
    window.addEventListener("resize", resize); resize();

    function project(x, y, z) {
      const X = x - origin[0], Y = y - origin[1], Z = z - origin[2];
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const x1 = cy * X + sy * Y;
      const y1 = -sy * X + cy * Y;
      const y2 = cp * y1 - sp * Z;
      const z2 = sp * y1 + cp * Z;
      const f = 520 / (dist + z2);
      return [canvas.width/2 + x1 * f * devicePixelRatio, canvas.height/2 - y2 * f * devicePixelRatio, z2];
    }
    function sample(time) {
      let lo = 0, hi = TRACK.length - 1;
      while (lo < hi - 1) {
        const m = (lo + hi) >> 1;
        if (TRACK[m].t < time) lo = m; else hi = m;
      }
      const a = TRACK[lo], b = TRACK[hi];
      const u = b.t === a.t ? 0 : (time - a.t) / (b.t - a.t);
      const mix = (k) => a[k] + (b[k] - a[k]) * u;
      return { seg: a.seg, x: mix("x"), y: mix("y"), z: mix("z"), v: mix("v"), F: mix("F"), seat: mix("seat"), t: time };
    }
    function frame(now) {
      if (playing) {
        const dt = Math.min(0.05, (now - last) / 1000);
        t = Math.min(T_END, t + dt);
        if (t >= T_END) playing = false;
        document.getElementById("play").textContent = playing ? "Pause" : "Play";
      }
      last = now;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.lineWidth = 2.2 * devicePixelRatio;
      let prev = null, prevSeg = 0;
      for (const p of TRACK) {
        const q = project(p.x, p.y, p.z);
        if (prev && p.seg === prevSeg) {
          ctx.strokeStyle = COL[p.seg];
          ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
        }
        prev = q; prevSeg = p.seg;
      }
      const s = sample(t);
      const q = project(s.x, s.y, s.z);
      ctx.fillStyle = "#f4d35e";
      ctx.beginPath(); ctx.arc(q[0], q[1], 6*devicePixelRatio, 0, 7); ctx.fill();
      document.getElementById("hud").innerHTML =
        `<span>${NAMES[s.seg]}</span><b>${s.v.toFixed(2)} m/s</b>` +
        `<span>height ${s.z.toFixed(2)} m</span><br><span>|F| ${s.F.toFixed(2)} g · seat ${s.seat.toFixed(2)} g</span>`;
      document.getElementById("clock").textContent = t.toFixed(2) + " s";
      document.getElementById("scrub").value = Math.round(1000 * t / T_END);
      requestAnimationFrame(frame);
    }
    document.getElementById("play").onclick = () => {
      if (t >= T_END) t = 0;
      playing = !playing;
      document.getElementById("play").textContent = playing ? "Pause" : "Play";
    };
    document.getElementById("reset").onclick = () => { t = 0; playing = false; document.getElementById("play").textContent = "Play"; };
    document.getElementById("scrub").oninput = (e) => { t = T_END * e.target.value / 1000; playing = false; document.getElementById("play").textContent = "Play"; };
    let drag = null;
    canvas.onpointerdown = (e) => { drag = {x:e.clientX, y:e.clientY, yaw, pitch}; canvas.setPointerCapture(e.pointerId); };
    canvas.onpointermove = (e) => { if (!drag) return; yaw = drag.yaw + (e.clientX-drag.x)*0.01; pitch = Math.max(-0.2, Math.min(1.2, drag.pitch + (e.clientY-drag.y)*0.008)); };
    canvas.onpointerup = () => drag = null;
    canvas.onwheel = (e) => { dist = Math.max(40, Math.min(280, dist + e.deltaY*0.08)); e.preventDefault(); };
    requestAnimationFrame(frame);
